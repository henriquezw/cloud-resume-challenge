name: Deploy Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch: 
jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.GHA_S3_PUBLISHER_ROLE_ARN_AWS }} # need lambda role
        aws-region: us-east-1
