name: Deploy Lambda

on:
  push:
    branches: [ main ]
    paths:
      - "infra/*"
      - "backend/*"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply (apply is destructive — review the plan first)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.GHA_S3_PUBLISHER_ROLE_ARN_AWS }} # need for getting the trust policy for OIDC credentials
        aws-region: us-east-1
